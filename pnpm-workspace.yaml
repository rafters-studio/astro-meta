packages:
  - tests/examples/*
configDependencies:
  "@rafters/toolchain": 0.1.4
catalog:
  "@rafters/toolchain": ^0.1.4
  # Kept over the toolchain's @types/node ^24: the package supports Node >=22 (engines), so tsc must
  # reject an API Node 22 lacks.
  "@types/node": ^22.10.0
minimumReleaseAgeExclude:
  - "@rafters/toolchain"
# pnpm 10 skipped these build scripts by default; pnpm 12 fails on an unlisted one.
allowBuilds:
  esbuild: false
  lefthook: false
  sharp: false
